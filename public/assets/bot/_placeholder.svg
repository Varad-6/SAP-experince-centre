<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1F44"/>
      <stop offset="100%" stop-color="#162D5A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0070F2"/>
      <stop offset="100%" stop-color="#00C8F8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A6E" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#14264A" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#254682" stroke-width="0.75" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Top App Bar -->
  <rect x="30" y="24" width="740" height="42" rx="8" fill="#14264A" stroke="#2D4D86" stroke-width="1"/>
  <circle cx="52" cy="45" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="68" cy="45" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="84" cy="45" r="5" fill="#10B981" opacity="0.8"/>
  <rect x="110" y="38" width="160" height="14" rx="4" fill="#2D4D86"/>
  <rect x="620" y="36" width="130" height="18" rx="9" fill="url(#accentGrad)"/>
  <text x="685" y="49" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">CLEAN CORE LIVE</text>

  <!-- KPI Row (3 Cards) -->
  <!-- Card 1 -->
  <rect x="30" y="82" width="233" height="90" rx="10" fill="url(#cardGrad)" stroke="#2D4D86" stroke-width="1"/>
  <rect x="46" y="98" width="80" height="10" rx="3" fill="#64748B"/>
  <text x="46" y="142" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">99.4%</text>
  <rect x="180" y="125" width="65" height="20" rx="10" fill="#107E3E" opacity="0.3"/>
  <text x="212" y="139" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">+14% YoY</text>

  <!-- Card 2 -->
  <rect x="283" y="82" width="234" height="90" rx="10" fill="url(#cardGrad)" stroke="#2D4D86" stroke-width="1"/>
  <rect x="299" y="98" width="90" height="10" rx="3" fill="#64748B"/>
  <text x="299" y="142" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">$1.8M</text>
  <rect x="434" y="125" width="65" height="20" rx="10" fill="#0070F2" opacity="0.3"/>
  <text x="466" y="139" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Saved</text>

  <!-- Card 3 -->
  <rect x="537" y="82" width="233" height="90" rx="10" fill="url(#cardGrad)" stroke="#2D4D86" stroke-width="1"/>
  <rect x="553" y="98" width="70" height="10" rx="3" fill="#64748B"/>
  <text x="553" y="142" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">&lt; 25m</text>
  <rect x="687" y="125" width="65" height="20" rx="10" fill="#F59E0B" opacity="0.3"/>
  <text x="720" y="139" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Cycle Time</text>

  <!-- Main Chart & Workflow Area (Left Chart 440px, Right Table 280px) -->
  <rect x="30" y="188" width="440" height="236" rx="10" fill="url(#cardGrad)" stroke="#2D4D86" stroke-width="1"/>
  <text x="50" y="214" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ENTERPRISE TELEMETRY &amp; EVENT MESH</text>
  
  <!-- Line Chart Grid Lines -->
  <line x1="50" y1="240" x2="445" y2="240" stroke="#254682" stroke-width="1" stroke-dasharray="4"/>
  <line x1="50" y1="280" x2="445" y2="280" stroke="#254682" stroke-width="1" stroke-dasharray="4"/>
  <line x1="50" y1="320" x2="445" y2="320" stroke="#254682" stroke-width="1" stroke-dasharray="4"/>
  <line x1="50" y1="360" x2="445" y2="360" stroke="#254682" stroke-width="1" stroke-dasharray="4"/>
  <line x1="50" y1="400" x2="445" y2="400" stroke="#2D4D86" stroke-width="1"/>

  <!-- Waveform / Chart Path -->
  <path d="M 50 360 Q 110 320, 160 340 T 260 260 T 360 270 T 445 220" fill="none" stroke="url(#accentGrad)" stroke-width="3"/>
  <!-- Bar markers -->
  <circle cx="160" cy="340" r="4" fill="#00C8F8"/>
  <circle cx="260" cy="260" r="4" fill="#00C8F8"/>
  <circle cx="360" cy="270" r="4" fill="#00C8F8"/>
  <circle cx="445" cy="220" r="4" fill="#00C8F8"/>

  <!-- Right Table / Status Panel -->
  <rect x="486" y="188" width="284" height="236" rx="10" fill="url(#cardGrad)" stroke="#2D4D86" stroke-width="1"/>
  <text x="506" y="214" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">INTEGRATION STATUS</text>

  <!-- Row 1 -->
  <rect x="506" y="232" width="244" height="34" rx="6" fill="#1A2F56"/>
  <rect x="518" y="244" width="70" height="10" rx="3" fill="#CBD5E1"/>
  <rect x="680" y="240" width="58" height="18" rx="4" fill="#10B981" opacity="0.2"/>
  <text x="709" y="253" fill="#34D399" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">SYNCED</text>

  <!-- Row 2 -->
  <rect x="506" y="274" width="244" height="34" rx="6" fill="#1A2F56"/>
  <rect x="518" y="286" width="90" height="10" rx="3" fill="#CBD5E1"/>
  <rect x="680" y="282" width="58" height="18" rx="4" fill="#0070F2" opacity="0.2"/>
  <text x="709" y="295" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ACTIVE</text>

  <!-- Row 3 -->
  <rect x="506" y="316" width="244" height="34" rx="6" fill="#1A2F56"/>
  <rect x="518" y="328" width="60" height="10" rx="3" fill="#CBD5E1"/>
  <rect x="680" y="324" width="58" height="18" rx="4" fill="#10B981" opacity="0.2"/>
  <text x="709" y="337" fill="#34D399" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">CLEAN</text>

  <!-- Row 4 -->
  <rect x="506" y="358" width="244" height="34" rx="6" fill="#1A2F56"/>
  <rect x="518" y="370" width="85" height="10" rx="3" fill="#CBD5E1"/>
  <rect x="680" y="366" width="58" height="18" rx="4" fill="#00C8F8" opacity="0.2"/>
  <text x="709" y="379" fill="#00C8F8" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">VERIFIED</text>
</svg>
