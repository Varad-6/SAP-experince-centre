<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" fill="none">
  <!-- Parachute Canopy Dome -->
  <path d="M 20 100 Q 120 -10 220 100 Q 195 90 170 100 Q 145 90 120 100 Q 95 90 70 100 Q 45 90 20 100 Z" fill="#0070F2"/>

  <!-- Alternating White / Cyan Stripes -->
  <path d="M 70 100 Q 95 90 120 100 Q 120 15 70 100 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M 120 100 Q 145 90 170 100 Q 120 15 170 100 Z" fill="#00C8F8" opacity="0.85"/>
  <path d="M 20 100 Q 45 90 70 100 Q 60 40 20 100 Z" fill="#0058C2"/>
  <path d="M 170 100 Q 195 90 220 100 Q 180 40 220 100 Z" fill="#0058C2"/>

  <!-- Canopy Outline / Trim -->
  <path d="M 20 100 Q 120 -10 220 100" stroke="#0A1F44" stroke-width="3" stroke-linecap="round"/>
  <path d="M 20 100 Q 45 90 70 100 Q 95 90 120 100 Q 145 90 170 100 Q 195 90 220 100" stroke="#0A1F44" stroke-width="2.5"/>

  <!-- Suspension Lines to Central Riser -->
  <line x1="22" y1="100" x2="120" y2="175" stroke="#5B6B85" stroke-width="1.5" stroke-dasharray="2 1"/>
  <line x1="70" y1="100" x2="120" y2="175" stroke="#5B6B85" stroke-width="1.5"/>
  <line x1="120" y1="100" x2="120" y2="175" stroke="#5B6B85" stroke-width="2"/>
  <line x1="170" y1="100" x2="120" y2="175" stroke="#5B6B85" stroke-width="1.5"/>
  <line x1="218" y1="100" x2="120" y2="175" stroke="#5B6B85" stroke-width="1.5" stroke-dasharray="2 1"/>

  <!-- Harness Carabiner / Ring -->
  <circle cx="120" cy="175" r="4" fill="#0A1F44" stroke="#00C8F8" stroke-width="2"/>
</svg>
